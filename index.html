<!doctype html>

<head>
  <meta charset="UTF-8" />

  <title>Realevate Landing Page | Codegrid</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <nav>
    <div class="nav-item">

    </div>
    <div class="nav-item">
      <a href="/">
        <img src="/public/logo.svg" alt="" />
      </a>
    </div>
    <div class="nav-item">

    </div>
  </nav>

  <section class="hero">
    <div class="marquee">
      <div class="marquee-track">

      <p class="hero-review-text-container">
        <textarea
          class="hero-review-text">A growing archive of people, places and the small moments between them.</textarea>
      </p>

          <span class="hero-review-text">COPY REVIEW &amp; OPEN GOOGLE</span>

        <div class="digit-col"></div>
